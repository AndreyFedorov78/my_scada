# Вставляется в server { } scada.tldev.ru и i.tldev.ru (/etc/nginx/sites-available/scada).
# Живые показания для главной: WebSocket к mosquitto, только для вошедших в Django.
    location = /mqtt {
        auth_request /scada_api/mqtt_auth/;
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }

    location = /scada_api/mqtt_auth/ {
        internal;
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn_scada.sock;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
