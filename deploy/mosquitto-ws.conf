# Вставляется в /etc/mosquitto/mosquitto.conf ПЕРЕД include_dir
# (не в conf.d: его подключает и второй экземпляр mosquitto-ssl — был бы конфликт порта).
#
# WebSocket для браузеров главной (nginx /mqtt -> 127.0.0.1:9001), только чтение показаний.
# Устройства, mqtt_scada и Django по-прежнему ходят на 1883 без ограничений.
# Внимание: в mosquitto 1.6 websockets-листенер игнорирует адрес привязки и слушает на всех
# интерфейсах — снаружи 9001 закрыт iptables (см. mosquitto-override.conf).
per_listener_settings true
port 1883
allow_anonymous true

listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /etc/mosquitto/ws.acl
