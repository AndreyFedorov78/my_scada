# /etc/systemd/system/mosquitto.service.d/override.conf
# WebSocket-порт 9001 доступен только nginx на этой машине (снаружи — через /mqtt с проверкой входа)
[Service]
ExecStartPre=+/bin/sh -c 'iptables -C INPUT -p tcp --dport 9001 ! -i lo -j DROP 2>/dev/null || iptables -I INPUT -p tcp --dport 9001 ! -i lo -j DROP'
ExecStartPre=+/bin/sh -c 'ip6tables -C INPUT -p tcp --dport 9001 ! -i lo -j DROP 2>/dev/null || ip6tables -I INPUT -p tcp --dport 9001 ! -i lo -j DROP'
