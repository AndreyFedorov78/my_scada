{% extends "scada/base.html" %}

{% block  content %}


	{% verbatim %}



	<!-- Блок отображения данных-->
	<div id="app"> <!-- область приложениея vue -->

	<div class="app">

		<div class="card-deck row">

			<!-- Окна с виджетами -->
			<div class="card" style="max-width: 100%;">
				<!--заголовок окна-->
				<div class="card-header">
					<h4 class="my-0 font-weight-normal">


						Список доступных датчиков


					</h4>
				</div>

				<!--Содержимое -->
			<div class="mt-3 mb-3">
				<table class="table table-sm table-bordered ">
				<thead>
				<td> <small><b>ID</b></small> </td>
				<td> <small><b>Наименование</b></small> </td>
				<td> <small><b>Виджет</b></small> </td>
				<td> <small><b>Активирован</b></small> </td>
				<td> <small><b>История<br>записывается</b></small> </td>
				<td> <small><b>на экране</b></small> </td>

				</thead>
					<tr v-for="sensor in sensor_list">
						<td class="text-left"> <small>#{{sensor.id}}</small></td>
						<td><input class="form-control form-control-sm" v-model="sensor.title"></td>
						<td>

							<select class="form-control form-control-sm" v-if="sensor.widget" v-model="sensor.widget.id">
							{% endverbatim %}
							{% for widget in widgets %}
								<option value="{{ widget.id }}"> {{ widget }} </option>><br>
							{% endfor %}

							{% verbatim %}
							</select>
						</td>

						<td class="text-center"><input  type="checkbox" v-model="sensor.active"></td>
						<td class="text-center"><input  type="checkbox" v-model="sensor.archive"></td>
					<td></td>


					</tr>
				</table>

			</div>
			</div>
		</div>


	</div>
	{% endverbatim %}





{% endblock %}


{% block js %}  <script src="/static/js/settings.js"></script> {% endblock %}
