{% verbatim %}

<!-- R-100 — скорость вентилятора 0..3, R-206 — ступень нагрева 0..5, R-750 == 6 — нагрев включён -->
<div class="vent">
    <div class="vent-col">
        <div class="vent-icon">
            <img v-if="mb_element(item,'R-100') == 0" src="/static/img/fan-gif-off.gif" width="30">
            <img v-else src="/static/img/fan-gif.gif" width="30">
        </div>
        <div class="vent-levels">
            <div v-for="level in [3, 2, 1]" v-on:click="devManage(item,'R-100',level)" class="vent-cell"
                 :class="mb_element(item,'R-100') >= level ? 'bg-primary' : 'bg-secondary'"></div>
        </div>
        <div v-on:click="devManage(item,'R-100',0)" class="vent-off"
             :class="{'text-danger': mb_element(item,'R-100') == 0}"><b>off</b></div>
    </div>

    <div class="vent-col">
        <div class="vent-icon">
            <img v-if="mb_element(item,'R-206') == 0" src="/static/img/heat-off.png" width="30">
            <img v-else src="/static/img/heat.png" width="30">
        </div>
        <div class="vent-levels">
            <div v-for="level in [5, 4, 3, 2, 1]" v-on:click="devManage(item,'R-206',level)" class="vent-cell"
                 :class="mb_element(item,'R-206') >= level ? 'bg-danger' : 'bg-secondary'"></div>
        </div>
        <div v-on:click="devManage(item,'R-206',0)" class="vent-off"
             :class="{'text-danger': mb_element(item,'R-206') == 0}"><b>off</b></div>
    </div>

    <div class="vent-col vent-info">
        <div class="vent-row-2">
            <img v-if="mb_element(item,'R-750') != 6" src="/static/img/heating-off.png" width="50">
            <img v-else src="/static/img/heating.png" width="50">
        </div>
        <div>
            <span v-if="mb_element(item,'R-750') == 6" class="text-danger"><b>ON</b></span>
            <span v-else class="text-secondary"><b>OFF</b></span>
        </div>
        <div class="vent-row-2"><img src="/static/img/rotor.jpg" width="50"></div>
    </div>
</div>

{% endverbatim %}
