{% verbatim %}

<!-- C-0: состояние реле битовой маской (data - 256), бит n — реле n+1 -->
<span v-for="sensor in item.data">
    <div v-if="sensor.type && sensor.type.subtitle == 'C-0'">
        <div v-for="n in [3, 2, 1, 0]" class="relay_button"
             :style="(sensor.data - 256) & (1 << n) ? 'background:green' : ''"
             v-on:click="devManage(item, 'C-' + n, (sensor.data - 256) & (1 << n) ? 0 : 256*255)">{{ n + 1 }}</div>
    </div>
</span>
<br><br>

{% endverbatim %}
